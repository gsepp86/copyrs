[package]
name = "copyrs"
version = "2.2.0"
edition = "2021"
description = "Copiatore di file minimale con verifica CRC32, pausa e coda"
license = "MIT"

[dependencies]
eframe = "0.29"
rfd = "0.15"
egui_extras = "0.29"
crc32fast = "1"

[profile.release]
opt-level = 3
lto = true
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
clipboard-win = "5"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
