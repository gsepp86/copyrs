name: Build and Package

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Exe
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CopyRS
          path: |
            target/release/*.exe
            installer/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/copyrs.exe
          name: CopyRs v2.3.2
          body: |
            ## CopyRs v2.3.2

            Copiatore di file veloce per Windows, con interfaccia grafica, verifica
            dei dati copiati e gestione degli errori.

            ### Novità di questa versione

            - **Controllo dello spazio su disco**: prima di copiare, l'app legge lo spazio
              libero reale del volume di destinazione (API di Windows). Se non basta per
              la coda, i file non vengono nemmeno aperti e restano con il motivo scritto.
            - **Motivo degli errori**: ogni copia fallita riporta la causa, ad esempio
              `Spazio insufficiente: richiesto X GB, disponibile Y GB`.
            - **Pulsante Riprova**: nella barra laterale compare `Retry N file` quando
              ci sono file falliti; un clic li rimette in coda e li ricopia.
            - **Conteggio dei falliti**: la barra laterale mostra `Falliti: N` in rosso,
              così vedi subito quanti file non sono stati copiati.
            - **Riprova sempre disponibile**: il pulsante `Riprova N file` resta visibile
              anche a copia terminata (utile dopo aver liberato spazio sulla chiavetta) e
              ogni riga in errore ha il suo pulsante `Riprova`.

            ### Caratteristiche principali

            - Copia file e intere cartelle con coda e avanzamento in tempo reale
            - Verifica dell'integrità dei file copiati (hash)
            - Gestione dei conflitti: sovrascrivi, salta, solo più recenti, rinomina
            - Pausa, salta file, annulla tutto e ripresa della copia
            - Interfaccia nativa veloce e leggera

            ### Note

            Nessuna modifica incompatibile: aggiorna semplicemente il programma.
            Scarica `copyrs.exe` qui sotto e avvialo.
